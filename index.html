*{

  font-family:Arial,Helvetica,sans-serif;

body{
  min-height:100vh;
  color:#fff;
  background:

  overflow-x:hidden;
}

body::before{

  width:700px;
  height:400px;

  pointer-events:none;
}

.header{

}

.title-icon{
  color:#008cff;
  font-size:23px;
}

.label{

}
